services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrow_demo
      POSTGRES_USER: qrow_demo
      POSTGRES_PASSWORD: qrow_demo_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - qrow_demo_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrow_demo -d qrow_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  qrow_demo_data:
