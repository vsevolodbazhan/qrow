kyuubi.frontend.thrift.binary.bind.host 0.0.0.0
kyuubi.frontend.thrift.binary.bind.port 10009
kyuubi.authentication LDAP
kyuubi.authentication.ldap.url ldap://ldap:389
kyuubi.authentication.ldap.baseDN dc=qrow,dc=test
kyuubi.authentication.ldap.userDNPattern uid=%s,ou=people,dc=qrow,dc=test
kyuubi.ha.addresses zookeeper:2181
kyuubi.engine.share.level USER
kyuubi.session.engine.idle.timeout PT30S
kyuubi.session.engine.initialize.timeout PT120S
spark.master spark://spark-master:7077
spark.submit.deployMode client
spark.driver.host kyuubi
spark.driver.bindAddress 0.0.0.0
spark.driver.memory 1g
spark.executor.memory 1g
spark.executor.cores 1
spark.cores.max 2
spark.sql.shuffle.partitions 2
spark.sql.session.timeZone UTC
spark.task.maxFailures 1
spark.speculation false
spark.ui.enabled true
spark.jars /opt/spark/jars/qrow-fixture.jar
spark.extraListeners io.qrow.fixture.Blocking$CompletionListener
