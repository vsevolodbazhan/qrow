[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
# These inherited maintenance advisories have no compatible fixed releases.
# Each waiver expires; scripts/check-policy.py enforces the dates.
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std via GPUI HTTP/tar. Requires upstream migration to smol. review-by: 2026-12-11" },
    { id = "RUSTSEC-2024-0384", reason = "instant via GPUI Component notify 7. Requires upstream notify migration. review-by: 2026-12-11" },
    { id = "RUSTSEC-2024-0436", reason = "paste in GPUI Component and Metal bindings. Requires upstream macro migration. review-by: 2026-12-11" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via GPUI stacksafe macro. Build-time dependency awaiting upstream replacement. review-by: 2026-12-11" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via GPUI zed-reqwest. Requires upstream HTTP client migration. review-by: 2026-12-11" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via GPUI SVG rendering. Requires upstream usvg migration. review-by: 2026-12-11" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via GPUI SVG font parsing. Requires upstream font stack migration. review-by: 2026-12-11" },
]

[licenses]
allow = ["0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
# GPUI currently brings several incompatible major versions. Keep these visible.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "eframe", reason = "The application uses GPUI." },
    { crate = "egui", reason = "Keep one UI toolkit." },
    { crate = "wry", reason = "No embedded browser in the native application." },
    { crate = "lb-wry", reason = "No embedded browser in the native application." },
    { crate = "jni", reason = "No local JVM in the native application." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
