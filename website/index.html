<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qrow</title>
  <meta name="description" content="A native SQL workbench for macOS and Linux.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e2024">
  <meta property="og:title" content="Qrow">
  <meta property="og:description" content="A native SQL workbench for macOS and Linux.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="media/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/qrow-256.png">
  <link rel="preload" href="fonts/IBMPlexSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Lucide icons (ISC License), the icon set of the app. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
  </svg>

  <main>
    <section class="hero">
      <img class="app-icon" src="icons/qrow-256.png" alt="" width="96" height="96">
      <h1>Qrow</h1>
      <p class="lede">A native SQL workbench for macOS and Linux.</p>
      <div class="cta">
        <a class="btn btn-primary btn-lg" href="https://github.com/vsevolodbazhan/qrow">
          <svg class="icon"><use href="#i-arrow-right"/></svg>
          <span>View on GitHub</span>
        </a>
        <div class="cmd" data-copy="brew tap vsevolodbazhan/qrow &amp;&amp; brew install --cask vsevolodbazhan/qrow/qrow">
          <span class="cmd-prompt" aria-hidden="true">$</span>
          <code>brew install --cask vsevolodbazhan/qrow/qrow</code>
          <button class="btn btn-ghost btn-icon copy" type="button" aria-label="Copy install commands" data-tip="Copy">
            <svg class="icon"><use href="#i-copy"/></svg>
          </button>
        </div>
      </div>
    </section>

    <figure class="window">
      <img src="media/hero.webp" width="2560" height="1643"
           alt="Qrow with the schema catalog, a SQL query, its results, and the assistant panel">
    </figure>
  </main>

  <footer class="statusbar">
    <div class="statusbar-inner">
      <span class="status-item">MIT License</span>
      <nav class="status-right" aria-label="Links">
        <a class="status-item" href="https://github.com/vsevolodbazhan/qrow/releases">Releases</a>
        <a class="status-item" href="https://github.com/vsevolodbazhan/qrow/tree/main/docs">Docs</a>
      </nav>
    </div>
  </footer>

  <script src="site.js" defer></script>
</body>
</html>
