# cargo-nextest configuration. qtest runs Rust tests through these profiles;
# see docs/testing.md.

[profile.default]
# A test either passes or fails. Retries hide instability.
retries = 0
fail-fast = false
# Mark a test slow after 30 s and stop it after 4 periods (2 minutes).
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "final"
status-level = "slow"
final-status-level = "fail"

[profile.default.junit]
path = "junit.xml"

[profile.ci]
inherits = "default"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
