[project]
name = "qrow-packaging"
version = "0.1.0"
description = "Reproducible packaging helpers for Qrow"
requires-python = ">=3.11"
dependencies = [
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
