name: core
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
      backend: ${{ steps.filter.outputs.backend }}
      macos: ${{ steps.filter.outputs.macos }}
      scripts: ${{ steps.filter.outputs.scripts }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            changed_files='force all checks'
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi
          changed() {
            printf '%s\n' "$changed_files" | grep -Eq "$1"
          }
          all=false
          if [ "$changed_files" = 'force all checks' ] || changed '^\.github/workflows/'; then all=true; fi
          dependencies=$all
          backend=$all
          macos=$all
          scripts=$all
          if changed '^(Cargo\.toml|Cargo\.lock|deny\.toml|dependency-reviews\.toml|scripts/core/(dependencies|install)\.sh|scripts/core/policy\.py|scripts/core/preflight\.sh)$'; then dependencies=true; fi
          if changed '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|src/|tests/)'; then backend=true; fi
          if changed '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|src/|assets/|pyproject\.toml|uv\.lock|scripts/package/|scripts/core/(macos|performance|preflight)\.sh|scripts/e2e/|tests/e2e/)'; then macos=true; fi
          if changed '^(\.githooks/|scripts/)'; then scripts=true; fi
          e2e=false
          if [ "$backend" = true ] || [ "$macos" = true ]; then e2e=true; fi
          {
            echo "dependencies=$dependencies"
            echo "backend=$backend"
            echo "macos=$macos"
            echo "scripts=$scripts"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$e2e" > e2e-required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-changes
          path: e2e-required
          retention-days: 1
          if-no-files-found: error

  backend:
    name: backend
    needs: [changes, dependencies]
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.scripts == 'true') && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.backend == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.backend == 'true'
        with:
          shared-key: core
      - if: needs.changes.outputs.backend == 'true'
        run: sh scripts/core/backend.sh
      - name: Install script linters
        if: needs.changes.outputs.scripts == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.scripts == 'true'
        run: sh scripts/core/scripts.sh
      - name: Install coverage tooling
        if: needs.changes.outputs.backend == 'true'
        run: |
          cargo install --locked cargo-llvm-cov --version 0.9.1
          rustup component add llvm-tools-preview
      - if: needs.changes.outputs.backend == 'true'
        run: sh scripts/core/coverage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.backend == 'true'
        with:
          name: core-coverage
          path: target/coverage/core.lcov
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macos
    needs: [changes, dependencies, backend]
    if: always() && needs.changes.outputs.macos == 'true' && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped') && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: sh scripts/core/macos.sh
      - name: SQL performance budgets
        shell: bash
        run: |
          set -o pipefail
          sh scripts/core/performance.sh | tee performance.txt
      - run: sh scripts/package/macos.sh
      - run: python3 scripts/core/size.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package-and-performance
          path: |
            dist/Qrow-macos.zip
            performance.txt
          retention-days: 14
          if-no-files-found: error

  dependencies:
    name: dependencies
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dependency-tools
          cache-all-crates: true
      - run: sh scripts/core/install.sh
      - run: python3 scripts/core/policy.py
      - run: sh scripts/core/dependencies.sh
