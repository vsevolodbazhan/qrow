name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - nightly
          - stable
        default: nightly
      commit:
        description: Commit SHA or ref. Leave blank for the latest commit on the selected branch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - name: Resolve target commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-core
      - run: sh scripts/check.sh core/backend

  package-and-release:
    name: package and release
    needs: core
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.core.outputs.target_sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          base_version="$(cargo metadata --locked --no-deps --format-version 1 |
            uv run --locked python scripts/package/version.py)"

          case "$CHANNEL" in
            nightly)
              release_version="${base_version}-nightly.$(date -u +%Y%m%d).${RUN_NUMBER}"
              release_tag="v${release_version}"
              release_title="Qrow Nightly ${release_version}"
              prerelease=true
              channel_filter='.isPrerelease == true'
              ;;
            stable)
              release_version="$base_version"
              release_tag="v${release_version}"
              release_title="Qrow ${release_version}"
              prerelease=false
              channel_filter='.isPrerelease == false'
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $release_tag." >&2
            exit 1
          fi

          previous_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            --jq "map(select(.isDraft == false and $channel_filter)) |
              sort_by(.publishedAt) | reverse | .[0].tagName // empty")"

          if [ -n "$previous_tag" ]; then
            if ! previous_sha="$(git rev-parse --verify "${previous_tag}^{commit}")"; then
              echo "The previous release tag is not present in the checkout: $previous_tag" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$previous_sha" "$target_sha"; then
              echo "The target commit must include the previous $CHANNEL release: $previous_tag" >&2
              exit 1
            fi
          fi

          {
            echo "target_sha=$target_sha"
            echo "base_version=$base_version"
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "prerelease=$prerelease"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Build application bundle
        run: sh scripts/package/macos.sh
      - name: Create DMG
        id: dmg
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          dmg_path="dist/Qrow-${RELEASE_VERSION}.dmg"
          hdiutil create \
            -volname "Qrow ${RELEASE_VERSION}" \
            -srcfolder dist/Qrow.app \
            -ov \
            -format UDZO \
            "$dmg_path"
          hdiutil imageinfo "$dmg_path" >/dev/null
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
      - name: Build changelog
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > release-notes.md
          else
            {
              echo "## Changes"
              echo
              git log --no-merges \
                --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
                "$TARGET_SHA"
            } > release-notes.md
          fi

          test -s release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            release create "$RELEASE_TAG"
            "$DMG_PATH"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
          )
          if [ "$PRERELEASE" = true ]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh "${release_args[@]}"
