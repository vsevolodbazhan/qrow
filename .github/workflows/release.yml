name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - nightly
          - stable
        default: nightly
      commit:
        description: Commit SHA, branch, or tag. Leave blank for the latest commit on the selected branch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-target:
    name: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: checkout-default
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: resolve-target
        id: target
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.commit || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! target_sha="$(git rev-parse --verify --end-of-options "${REQUESTED_REF}^{commit}")"; then
            echo "Could not resolve commit, branch, or tag: ${REQUESTED_REF}" >&2
            exit 1
          fi
          if [ "$target_sha" != "$WORKFLOW_SHA" ]; then
            echo "Select the workflow branch at the candidate commit; source and workflow must match." >&2
            exit 1
          fi
          git checkout --detach "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: setup-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: resolve-release-metadata
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          base_version="$(cargo metadata --locked --no-deps --format-version 1 |
            uv run --locked python scripts/package/version.py)"

          case "$CHANNEL" in
            nightly)
              release_version="${base_version}-nightly.$(date -u +%Y%m%d).${RUN_NUMBER}"
              release_tag="v${release_version}"
              release_title="Qrow Nightly ${release_version}"
              prerelease=true
              ;;
            stable)
              release_version="$base_version"
              release_tag="v${release_version}"
              release_title="Qrow ${release_version}"
              prerelease=false
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          {
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  platforms:
    needs: resolve-target
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ needs.resolve-target.outputs.target_sha }}
      release-version: ${{ needs.resolve-target.outputs.release_version }}
      full: true
      cold-cache: true

  dmg:
    name: dmg-${{ matrix.arch }}
    needs:
      - resolve-target
      - platforms
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            package: candidate-macos-arm64
            target: macos-arm64
          - arch: x86_64
            runner: macos-15-intel
            package: candidate-macos-x86_64
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: checkout-target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-target.outputs.target_sha }}
      - name: download-package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.package }}
          path: package
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: platform-evidence-${{ matrix.target }}
          path: evidence
      - name: Verify qualified app archive
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path("evidence/platform/receipt.json").read_text())
          archive = Path("package/Qrow-macos.zip")
          assert receipt["target"] == os.environ["TARGET"]
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["archive"] == archive.name
          assert receipt["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          PYVERIFY
      - name: setup-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: create-dmg
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-target.outputs.release_version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir dist
          ditto -x -k package/Qrow-macos.zip dist
          codesign --verify --deep --strict dist/Qrow.app
          test "$(lipo -archs dist/Qrow.app/Contents/MacOS/qrow)" = "$PACKAGE_ARCH"
          dmg_path="dist/Qrow-${RELEASE_VERSION}-${PACKAGE_ARCH}.dmg"
          uv run --locked python scripts/package/dmg.py build \
            --app dist/Qrow.app \
            --output "$dmg_path" \
            --volume-name "Qrow ${RELEASE_VERSION}"
          hdiutil imageinfo "$dmg_path" >/dev/null
          uv run --locked python scripts/package/qualify.py dist --dmg "$dmg_path" --receipt dist/dmg-receipt.json
          # Keep the old ARM64 URL valid until the tap updater supports both architectures.
          if [ "$PACKAGE_ARCH" = arm64 ]; then
            cp "$dmg_path" "dist/Qrow-${RELEASE_VERSION}.dmg"
          fi
      - name: upload-dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 1
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    needs: [resolve-target, platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: linux-x86_64
          - arch: aarch64
            target: linux-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: platform-evidence-${{ matrix.target }}
          path: evidence
      - name: Verify qualified archive
        env:
          RELEASE_VERSION: ${{ needs.resolve-target.outputs.release_version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path("evidence/platform/receipt.json").read_text())
          archive = Path("candidate") / f"Qrow-{os.environ['RELEASE_VERSION']}-linux-{os.environ['PACKAGE_ARCH']}.tar.gz"
          assert receipt["target"] == os.environ["TARGET"]
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["archive"] == archive.name
          assert receipt["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          PYVERIFY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: candidate/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    needs:
      - resolve-target
      - dmg
      - linux
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout-target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve-target.outputs.target_sha }}
      - name: download-dmg
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-dmg-*
          merge-multiple: true
          path: dist
      - name: download-linux
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist
      - name: resolve-previous-release
        id: previous
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.resolve-target.outputs.release_tag }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG." >&2
            exit 1
          fi

          case "$CHANNEL" in
            nightly) channel_filter='.isPrerelease == true' ;;
            stable) channel_filter='.isPrerelease == false' ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          previous_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            --jq "map(select(.isDraft == false and $channel_filter)) |
              sort_by(.publishedAt) | reverse | .[0].tagName // empty")"

          if [ -n "$previous_tag" ]; then
            if ! previous_sha="$(git rev-parse --verify "${previous_tag}^{commit}")"; then
              echo "The previous release tag is not present in the checkout: $previous_tag" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$previous_sha" "$TARGET_SHA"; then
              echo "The target commit must include the previous $CHANNEL release: $previous_tag" >&2
              exit 1
            fi
          fi

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: create-release-tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-target.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.resolve-target.outputs.release_title }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git

          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo "The existing tag $RELEASE_TAG points to $existing_sha, not $TARGET_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$TARGET_SHA" --message "$RELEASE_TITLE"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: build-changelog
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          RELEASE_TAG: ${{ needs.resolve-target.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > release-notes.md
          else
            {
              echo "## Changes"
              echo
              git log --no-merges \
                --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
                "$TARGET_SHA"
            } > release-notes.md
          fi

          test -s release-notes.md
      - name: publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-target.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.resolve-target.outputs.release_title }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          PRERELEASE: ${{ needs.resolve-target.outputs.prerelease }}
          RELEASE_VERSION: ${{ needs.resolve-target.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            release create "$RELEASE_TAG"
            "dist/Qrow-${RELEASE_VERSION}.dmg"
            "dist/Qrow-${RELEASE_VERSION}-arm64.dmg"
            "dist/Qrow-${RELEASE_VERSION}-x86_64.dmg"
            "dist/Qrow-${RELEASE_VERSION}-linux-x86_64.tar.gz"
            "dist/Qrow-${RELEASE_VERSION}-linux-aarch64.tar.gz"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
            --verify-tag
            --draft
            --latest=false
          )
          if [ "$PRERELEASE" = true ]; then
            release_args+=(--prerelease)
          fi
          (cd dist && sha256sum -- ./*.dmg ./*.tar.gz > SHA256SUMS)
          release_args+=(dist/SHA256SUMS)
          gh "${release_args[@]}"
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verification_dir"
          cmp dist/SHA256SUMS "$verification_dir/SHA256SUMS"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          publish_args=(release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false)
          if [ "$PRERELEASE" = true ]; then
            publish_args+=(--latest=false)
          else
            publish_args+=(--latest)
          fi
          gh "${publish_args[@]}"
