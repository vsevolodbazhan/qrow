          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-macos-arm64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ inputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
