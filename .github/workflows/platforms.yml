        if: always()
        with:
          name: platform-evidence-linux-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  required:
    name: validation-required
    if: always()
    needs: [common-required, test-macos-arm64, test-macos-x86-64, test-linux-x86-64, test-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYGATE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-evidence-*
          path: evidence
      - env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: python3 scripts/ci/platforms.py verify evidence "$SOURCE_SHA"
