name: platforms
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-version:
        type: string
        default: ""
      full:
        type: boolean
        default: false
      cold-cache:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - id: matrix
        env:
          FULL: ${{ inputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          echo "matrix=$(uv run --locked python scripts/ci/platforms.py matrix "${flags[@]}")" >> "$GITHUB_OUTPUT"

  native:
    name: native-${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      QROW_RELEASE_VERSION: ${{ inputs.release-version }}
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: ${{ github.workspace }}/target/package/Qrow-macos.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - if: matrix.system == 'linux'
        run: |
          sh scripts/ci/linux-build-deps.sh
          sudo apt-get install --yes xvfb xdotool mesa-vulkan-drivers
      - run: rustup show
      - if: matrix.system == 'macos' && inputs.full
        run: |
          qrow_java_home="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$qrow_java_home" >> "$GITHUB_ENV"
          echo "$qrow_java_home/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !inputs.cold-cache }}
        with:
          shared-key: platform-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Plan native validation
        env:
          TARGET: ${{ matrix.target }}
          SUITES: ${{ matrix.suites }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          read -r -a suites <<< "$SUITES"
          ./qtest plan "${suites[@]}" --target "$TARGET" --runtime "$RUNTIME" --output target/platform/plan.json
      - run: ./qtest execute target/platform/plan.json --install --output target/platform/result.json
      - run: ./qtest verify target/platform/plan.json target/platform/result.json
      - name: Stress UI synchronization
        if: inputs.full
        run: ./qtest run ui/timing --repeat 100
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: platform-evidence-${{ matrix.target }}
          path: |
            target/platform/
            target/qtest/runs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.target }}
          path: target/package/
          retention-days: 14
          if-no-files-found: error

  required:
    name: platform-required
    if: always()
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful jobs
        env:
          PLAN: ${{ needs.plan.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$PLAN" = success && test "$NATIVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-evidence-*
          path: evidence
      - env:
          SOURCE_SHA: ${{ inputs.ref }}
          FULL: ${{ inputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/platforms.py verify evidence "$SOURCE_SHA" "${flags[@]}"
