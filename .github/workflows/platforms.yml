            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && github.ref == 'refs/heads/main' && inputs.full }}
        with:
          name: performance-macos-arm64
          path: target/qtest/runs/**/perf.json
          retention-days: 90
          if-no-files-found: warn

