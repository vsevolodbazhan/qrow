name: e2e
on:
  workflow_run:
    workflows: [core]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.event }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.workflow_run.id }}" --name core-changes --dir core-changes
          echo "e2e=$(cat core-changes/e2e-required)" >> "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.e2e == 'true' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core
      - run: sh scripts/e2e/backend.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-evidence
          path: target/e2e/
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macos
    needs: [changes, backend]
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.e2e == 'true' && needs.backend.result == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: check-native-automation-permissions
        run: sh scripts/e2e/driver.sh --preflight
      - name: select-java-17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
      - run: sh scripts/e2e/macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-evidence
          path: |
            target/e2e/
            target/e2e-tools/preflight.log
          retention-days: 14
          if-no-files-found: error

  gate:
    name: gate
    if: always() && github.event.workflow_run.conclusion == 'success'
    needs: [changes, backend, macos]
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: require-both-suites
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          UI_RESULT: ${{ needs.macos.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
        run: |
          if [ "$E2E_REQUIRED" = true ] && { [ "$BACKEND_RESULT" != success ] || [ "$UI_RESULT" != success ]; }; then
            echo 'Both acceptance suites must pass on an internal branch. Fork contributions require maintainer review and an internal branch.' >&2
            exit 1
          fi
      - name: publish-commit-gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          UI_RESULT: ${{ needs.macos.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
        run: |
          state=failure
          if [ "$E2E_REQUIRED" != true ] || { [ "$BACKEND_RESULT" = success ] && [ "$UI_RESULT" = success ]; }; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f state="$state" -f context='e2e / gate' \
            -f description='Real backend and native UI acceptance' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
