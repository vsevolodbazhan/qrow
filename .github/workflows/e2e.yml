name: e2e
on:
  workflow_run:
    workflows: [core]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.event }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - id: filter
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CORE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$CORE_RUN_ID" --name core-changes --dir core-changes
          e2e="$(tr -d '[:space:]' < core-changes/e2e-required)"
          case "$e2e" in
            true | false) ;;
            *)
              echo "unexpected e2e-required value: '$e2e'" >&2
              exit 1
              ;;
          esac
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.e2e == 'true' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core
      - run: sh scripts/e2e/backend.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-evidence
          path: target/e2e/
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macos
    needs: [changes, backend]
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.e2e == 'true' && needs.backend.result == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: check-native-automation-permissions
        run: sh scripts/e2e/driver.sh --preflight
      - name: select-java-17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
      - run: sh scripts/e2e/macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-evidence
          path: |
            target/e2e/
            target/e2e-tools/preflight.log
          retention-days: 14
          if-no-files-found: error

  gate:
    name: gate
    if: always() && github.event.workflow_run.conclusion == 'success'
    needs: [changes, backend, macos]
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: evaluate-suites
        id: evaluate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          UI_RESULT: ${{ needs.macos.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$CHANGES_RESULT" != success ]; then
            reason="the changes job did not succeed ($CHANGES_RESULT), so e2e coverage is unknown"
          elif [ "$E2E_REQUIRED" = false ]; then
            state=success
            reason='no e2e-relevant changes'
          elif [ "$E2E_REQUIRED" = true ] && [ "$BACKEND_RESULT" = success ] && [ "$UI_RESULT" = success ]; then
            state=success
            reason='both acceptance suites passed'
          else
            reason="acceptance suites did not both pass (backend=$BACKEND_RESULT, macos=$UI_RESULT)"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "gate $state: $reason"
      - name: publish-commit-gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          STATE: ${{ steps.evaluate.outputs.state }}
        run: |
          set -euo pipefail
          state="$STATE"
          if [ "$state" != success ]; then
            state=failure
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_SHA" \
            -f state="$state" -f context='e2e / gate' \
            -f description='Real backend and native UI acceptance' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: require-both-suites
        env:
          STATE: ${{ steps.evaluate.outputs.state }}
          REASON: ${{ steps.evaluate.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$STATE" != success ]; then
            echo "Both acceptance suites must pass on an internal branch: $REASON." >&2
            echo 'Fork contributions require maintainer review and an internal branch.' >&2
            exit 1
          fi
