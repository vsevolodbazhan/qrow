    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-linux-arm64
          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-linux-arm64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ inputs.full || github.event_name != 'pull_request' }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py test "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-linux-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [common-required, test-macos-arm64, test-macos-x86-64, test-linux-x86-64, test-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYGATE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-evidence-*
          path: evidence
      - env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: python3 scripts/ci/platforms.py verify evidence "$SOURCE_SHA"
