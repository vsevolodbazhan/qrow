        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-linux-x86_64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
