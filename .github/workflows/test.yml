name: test
on:
  push:
    branches: [main]
  # Pull requests into any branch, so that stacked pull requests also get checks.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Validate native targets without Rust build caches.
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * 1-6"
    - cron: "17 2 * * 0"

permissions:
  contents: read

# A new commit cancels the run of an older commit of the same pull request.
# On main, a run finishes, so that it saves its build caches. A newer push
# waits for it, and replaces a push that is still waiting.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A draft pull request starts no jobs. Its converted_to_draft event cancels
    # the run in progress.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}

  platforms:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ github.sha }}
      full: ${{ github.event_name != 'pull_request' }}
      cold-cache: ${{ inputs.cold-cache == true || github.event.schedule == '17 2 * * 0' }}

  ci-required:
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [checks, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: test "$CHECKS" = success && test "$PLATFORMS" = success

  # A run on main can save new Rust caches next to the caches that they
  # replace. Delete the replaced caches to stay inside the repository limit,
  # also after a failed or cancelled run.
  cache-cleanup:
    name: cache-cleanup
    needs: checks
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: python3 scripts/ci/rust_caches.py
        env:
          GH_TOKEN: ${{ github.token }}
