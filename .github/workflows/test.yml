name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      reuse_macos_package:
        description: Reuse the package from core-macos in native E2E tests.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-dependencies:
    name: core-dependencies
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dependency-tools
          cache-all-crates: true
      - run: ./qtest install cargo-deny cargo-machete
      - run: ./qtest run deps

  core-scripts:
    name: core-scripts
    needs: core-dependencies
    if: success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: Install script linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./qtest run scripts

  core-backend:
    name: core-backend
    needs: core-scripts
    if: success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: ./qtest install cargo-nextest cargo-llvm-cov
      - run: ./qtest run fmt clippy rustdoc unit coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: core-coverage
          path: target/coverage/core.lcov
          retention-days: 1
          if-no-files-found: error

  core-macos:
    name: core-macos
    needs: core-backend
    if: success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: ./qtest install cargo-nextest
      - run: ./qtest run clippy unit ui perf
      - name: Keep the SQL performance report
        run: cp target/qtest/runs/latest/logs/perf.log performance.txt
      - run: sh scripts/package/macos.sh
      - run: uv run --locked python scripts/core/size.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: macos-package-and-performance
          path: |
            dist/Qrow-macos.zip
            performance.txt
          retention-days: 1
          if-no-files-found: error

  e2e-backend:
    name: e2e-backend
    needs: core-backend
    if: >
      success() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core
      - run: ./qtest install cargo-nextest
      - run: ./qtest run backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-evidence
          path: target/qtest/runs/
          retention-days: 1
          if-no-files-found: error

  e2e-macos:
    name: e2e-macos
    needs: [core-macos, e2e-backend]
    if: >
      success() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # The headless E2E tests are compiled in this job.
      - name: Select Rust toolchain
        run: rustup show
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
      - name: Check native automation permissions
        run: sh scripts/e2e/driver.sh --preflight
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
      - name: Download macOS package
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_macos_package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-package-and-performance
          path: target/macos-package
      - run: ./qtest install cargo-nextest
      - name: Run headless and native E2E
        run: ./qtest run e2e desktop --runtime native
        env:
          QROW_E2E_REUSE_MACOS_PACKAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_macos_package }}
          QROW_MACOS_PACKAGE: target/macos-package/dist/Qrow-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-evidence
          path: |
            target/qtest/runs/
            target/e2e-tools/preflight.log
          retention-days: 1
          if-no-files-found: error
