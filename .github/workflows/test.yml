name: test
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release-version:
        type: string
        default: ""
      full:
        type: boolean
        default: false
      cold-cache:
        type: boolean
        default: false

  push:
    branches: [main]
  # Pull requests into any branch, so that stacked pull requests also get checks.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # Unused while the repository has no merge queue (personal accounts cannot
  # have one). A merge queue run would qualify all native targets.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Validate native targets without Rust build caches.
        type: boolean
        default: false
  # A weekly cold run proves that a clean checkout builds. Pushes to main
  # already qualify every merge.
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

# Keep PR updates cancellable. Release calls use their caller workflow name,
# so they do not share the group of a direct test run. The weekly run has its
# own group, so a pending push to main cannot replace it. A run for a draft
# skips every job and uses its own group too. Otherwise a push just before
# "Ready for review" can cancel the run of the ready pull request, and the
# skipped ci-required check counts as passed.
concurrency:
  group: ${{ github.workflow }}-validation-${{ github.event_name == 'schedule' && 'weekly' || github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QROW_RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      common: ${{ steps.plan.outputs.common }}
      tier: ${{ steps.plan.outputs.tier }}
      full: ${{ steps.plan.outputs.full }}
      targets: ${{ steps.plan.outputs.targets }}
      common-jobs: ${{ steps.plan.outputs.common_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # A pull request checks out its merge commit. The first parent is the base.
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          if [ "$EVENT" = pull_request ]; then flags+=(--changed-since HEAD^1); fi
          python3 scripts/ci/platforms.py outputs --event "$EVENT" "${flags[@]}" | tee -a "$GITHUB_OUTPUT"

  common:
    name: common-${{ matrix.job }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.common) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: ${{ matrix.job == 'headless-ui' || matrix.job == 'server-ui' }}
          static: ${{ matrix.job == 'static' }}
      # The static job compiles nothing. Its cache would only use cache storage.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ matrix.job != 'static' && !(inputs.cold-cache == true || github.event_name == 'schedule') }}
        with:
          shared-key: common-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.cache == matrix.job }}
      - name: Plan common validation
        env:
          SUITES: ${{ matrix.suites }}
          COMMON_JOB: ${{ matrix.job }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          read -r -a suites <<< "$SUITES"
          ./qtest plan "${suites[@]}" --target linux-x86_64 --runtime docker --output target/common/plan.json
          if [ "$COMMON_JOB" = backend ] && [ "$FULL" = true ]; then
            suites+=(perf-kyuubi perf-postgres perf-trino)
          fi
          ./qtest plan "${suites[@]}" --target linux-x86_64 --runtime docker --output target/common/build-plan.json
      - name: Prepare common test binaries once
        if: matrix.prepare
        run: |
          ./qtest prepare target/common/build-plan.json --output target/common/builds --install
          cp target/common/builds/manifest.json target/common/build-manifest.json
      - name: Execute common validation
        env:
          PREPARE: ${{ matrix.prepare }}
        run: |
          flags=()
          if [ "$PREPARE" = true ]; then flags+=(--reuse-builds target/common/builds/manifest.json); fi
          ./qtest execute target/common/plan.json --install "${flags[@]}" --output target/common/result.json
      - name: Stress UI synchronization with the same binaries
        if: needs.plan.outputs.full == 'true' && matrix.job == 'headless-ui'
        run: |
          ./qtest plan ui/timing --target linux-x86_64 --runtime docker --repeat 100 --output target/common/stress-plan.json
          ./qtest execute target/common/stress-plan.json --reuse-builds target/common/builds/manifest.json --output target/common/stress-result.json
      - name: Record backend transfer measurements
        if: needs.plan.outputs.full == 'true' && matrix.job == 'backend'
        run: ./qtest run perf-kyuubi perf-postgres perf-trino --runtime docker --report-only --reuse-builds target/common/builds/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: common-evidence-${{ matrix.job }}
          path: |
            target/common/*.json
            target/coverage/
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && github.ref == 'refs/heads/main' && (matrix.job == 'backend' || matrix.job == 'performance') }}
        with:
          name: performance-common-${{ matrix.job }}
          path: target/qtest/runs/**/perf.json
          retention-days: 90
          if-no-files-found: warn

  common-required:
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [plan, common]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          COMMON: ${{ needs.common.result }}
        run: test "$PLAN" = success && test "$COMMON" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: common-evidence-*
          path: evidence
      - env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          FULL: ${{ needs.plan.outputs.full }}
          JOBS: ${{ needs.plan.outputs.common-jobs }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          python3 scripts/ci/platforms.py verify-common evidence "$SOURCE_SHA" --jobs "$JOBS" "${flags[@]}"

  build-macos-arm64:
    name: build-macos-arm64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets), 'macos-arm64')
    runs-on: macos-15
    timeout-minutes: 120
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
      QROW_WINDOW_OBSERVER: target/native-tools/window-ready
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !(inputs.cold-cache == true || github.event_name == 'schedule') }}
        with:
          shared-key: native-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py build --target macos-arm64 "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-macos-arm64
          path: target/native-transfer.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-macos-arm64
          path: target/package/Qrow-macos.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: build-evidence-macos-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  test-macos-arm64:
    name: test-macos-arm64
    needs: [plan, build-macos-arm64]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
      QROW_WINDOW_OBSERVER: target/native-tools/window-ready
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "true"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-macos-arm64
          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-macos-arm64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py test "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-macos-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && github.ref == 'refs/heads/main' && needs.plan.outputs.full == 'true' }}
        with:
          name: performance-macos-arm64
          path: target/qtest/runs/**/perf.json
          retention-days: 90
          if-no-files-found: warn

  build-macos-x86-64:
    name: build-macos-x86_64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets), 'macos-x86_64')
    # Apple silicon compiles the Intel candidate several times faster.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
      QROW_WINDOW_OBSERVER: target/native-tools/window-ready
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
          rust-target: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !(inputs.cold-cache == true || github.event_name == 'schedule') }}
        with:
          shared-key: native-macos-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py build --target macos-x86_64 "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-macos-x86_64
          path: target/native-transfer.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-macos-x86_64
          path: target/package/Qrow-macos.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: build-evidence-macos-x86_64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  test-macos-x86-64:
    name: test-macos-x86_64
    needs: [plan, build-macos-x86-64]
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
      QROW_WINDOW_OBSERVER: target/native-tools/window-ready
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "true"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-macos-x86_64
          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-macos-x86_64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py test "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-macos-x86_64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  build-linux-x86-64:
    name: build-linux-x86_64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets), 'linux-x86_64')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !(inputs.cold-cache == true || github.event_name == 'schedule') }}
        with:
          shared-key: native-linux-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py build --target linux-x86_64 "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-linux-x86_64
          path: target/native-transfer.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-x86_64
          path: target/package/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: build-evidence-linux-x86_64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  test-linux-x86-64:
    name: test-linux-x86_64
    needs: [plan, build-linux-x86-64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-linux-x86_64
          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-linux-x86_64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py test "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-linux-x86_64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  build-linux-arm64:
    name: build-linux-arm64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets), 'linux-arm64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !(inputs.cold-cache == true || github.event_name == 'schedule') }}
        with:
          shared-key: native-linux-arm64
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py build --target linux-arm64 "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-linux-arm64
          path: target/native-transfer.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-arm64
          path: target/package/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: build-evidence-linux-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  test-linux-arm64:
    name: test-linux-arm64
    needs: [plan, build-linux-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      QROW_E2E_REUSE_MACOS_PACKAGE: "true"
      QROW_MACOS_PACKAGE: target/package/Qrow-macos.zip
      QROW_NATIVE_PREPARED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          app: "true"
          java: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-linux-arm64
          path: target
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-linux-arm64
          path: target/package
      - run: ./qtest install cargo-nextest
      - env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flags=()
          if [ "$FULL" = true ]; then flags+=(--full); fi
          uv run --locked python scripts/ci/native.py test "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        with:
          name: platform-evidence-linux-arm64
          path: |
            target/platform/*.json
            target/platform/*.log
            target/qtest/runs/
            !target/qtest/runs/**/prepared/*/target/**
            !target/qtest/runs/**/*.app/**
          retention-days: 14
          if-no-files-found: error

  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [plan, common-required, test-macos-arm64, test-macos-x86-64, test-linux-x86-64, test-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          TIER: ${{ needs.plan.outputs.tier }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci/platforms.py gate
      # The static level selects no native target and has no native evidence.
      - if: needs.plan.outputs.targets != '[]'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: platform-evidence-*
          path: evidence
      - env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: python3 scripts/ci/platforms.py verify evidence "$SOURCE_SHA" --targets "$TARGETS"
