version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gpui:
        patterns:
          - gpui
          - gpui-component
          - gpui-component-assets
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
