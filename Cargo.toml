[package]
name = "qrow"
version = "0.1.0"
edition = "2024"
description = "A native SQL workbench for Spark through Kyuubi"
license = "MIT"
default-run = "qrow"

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:tree-sitter-sequel", "dep:async-channel"]

[[bin]]
name = "qrow"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
async-channel = { version = "2", optional = true }
gpui-kit = { version = "=0.6.1", features = ["tree-sitter"], optional = true }
tree-sitter-sequel = { version = "0.3.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thrift = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
proptest = "=1.11.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
large_stack_arrays = "warn"
large_futures = "warn"
needless_collect = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"

[[bench]]
name = "sql"
harness = false
