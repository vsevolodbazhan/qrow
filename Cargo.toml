[package]
name = "qrow"
version = "0.2.0"
edition = "2024"
description = "A native SQL workbench for Spark through Kyuubi"
license = "MIT"
default-run = "qrow"

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:tree-sitter-sequel", "dep:async-channel"]

[[bin]]
name = "qrow"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
async-channel = { version = "2", optional = true }
gpui-kit = { version = "=0.6.6", features = ["tree-sitter"], optional = true }
tree-sitter-sequel = { version = "0.3.8", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sqlformat = "0.5"
tempfile = "3"
thrift = { version = "0.24", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
proptest = "=1.11.0"

# Headless UI integration tests of the real Qrow window. The UI builds only on
# macOS; keep the version and source equal to the normal dependency.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["tree-sitter", "test-support"] }

[[test]]
name = "ui"
required-features = ["ui"]

[[test]]
name = "e2e"
required-features = ["ui"]

[[test]]
name = "perf"
required-features = ["ui"]

[patch.crates-io]
# GPUI Base 0.6.6 with Qrow fixes to the editor and Markdown text.
# vendor/gpui-base/QROW-PATCH.md lists them. Remove this patch when a GPUI Kit
# release includes all fixes.
gpui-base = { path = "vendor/gpui-base" }

# GPUI Component 0.6.6 with one Qrow fix: the rows of a dropdown list have
# space between them. See vendor/gpui-component/QROW-PATCH.md. Remove this
# patch when a GPUI Kit release includes the fix.
gpui-component = { path = "vendor/gpui-component" }

# GPUI's macOS platform 0.3.6 with one Qrow fix: a window stops its display
# link while GPUI requests no frames. See vendor/gpui-pre-macos/QROW-PATCH.md.
# Remove this patch when a GPUI release includes the fix.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# Performance probes build like the release, without link-time optimization,
# so that they compile faster.
[profile.perf]
inherits = "release"
lto = false
incremental = false

[profile.release]
# Keep the optional GPUI assistant inside the macOS package size budget.
opt-level = "s"
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
large_stack_arrays = "warn"
large_futures = "warn"
needless_collect = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"

[[bench]]
name = "sql"
harness = false
