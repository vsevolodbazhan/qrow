[package]
name = "qrow"
version = "0.1.0"
edition = "2024"
description = "A native SQL workbench for Spark through Kyuubi"
license = "Apache-2.0"
default-run = "qrow"

[dependencies]
anyhow = "1"
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thrift = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
